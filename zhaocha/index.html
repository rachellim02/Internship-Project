<title>申請書找碴王</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout: a counter desk (page) holding one paper application form; HUD above it, review cards below. */
:root {
  --desk: #e8ecef;
  --fg: #1d2733;
  --muted: #5b6875;
  --panel: #ffffff;
  --line: #c9d1d8;
  --accent: #1f4e79;      /* service ink blue */
  --accent-fg: #ffffff;
  --paper: #fdfcf7;       /* form paper stays paper in both themes */
  --paper-ink: #1f2f45;
  --paper-rule: #34495e;
  --paper-label: #5c6b7a;
  --yellow: #c98a00;
  --yellow-bg: #fff4d6;
  --red: #c4302b;
  --red-bg: #fde7e5;
  --green: #2f7d4f;
  --green-bg: #e3f3e8;
  --font-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-form: "Noto Serif TC", "PMingLiU", "Songti TC", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #151b22; --fg: #e4e9ee; --muted: #9aa7b4; --panel: #1e2630; --line: #33404d;
    --accent: #6fa8dc; --accent-fg: #0f1720;
    --yellow: #f0b429; --yellow-bg: #3a3014; --red: #f0716b; --red-bg: #3d1f1e;
    --green: #6cc28e; --green-bg: #1b3326;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #151b22; --fg: #e4e9ee; --muted: #9aa7b4; --panel: #1e2630; --line: #33404d;
  --accent: #6fa8dc; --accent-fg: #0f1720;
  --yellow: #f0b429; --yellow-bg: #3a3014; --red: #f0716b; --red-bg: #3d1f1e;
  --green: #6cc28e; --green-bg: #1b3326;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--desk); color: var(--fg); font-family: var(--font-ui);
  font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button { font: inherit; cursor: pointer; }
button:focus-visible, .f.click:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }

/* Intro */
.intro { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 28px 24px; display: grid; gap: 16px; }
.intro h1 { font-family: var(--font-form); font-size: clamp(32px, 7vw, 48px); font-weight: 900; color: var(--accent); line-height: 1.15; }
.intro p { margin: 0; max-width: 62ch; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.rule { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; }
.rule b { font-size: 14px; }
.rule span { font-size: 13px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; width: fit-content; }
.chip.y { background: var(--yellow-bg); color: var(--yellow); }
.chip.r { background: var(--red-bg); color: var(--red); }
.chip.g { background: var(--green-bg); color: var(--green); }
.chip.n { background: var(--line); color: var(--muted); }
.btn { border: 0; border-radius: 8px; padding: 12px 22px; font-weight: 700; background: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* HUD */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: grid; gap: 8px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--desk); }
.hud-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; align-items: baseline; }
.stat { font-variant-numeric: tabular-nums; font-weight: 700; }
.stat small { font-weight: 500; color: var(--muted); margin-right: 4px; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--accent); transition: width .1s linear; }
.bar i.low { background: var(--red); }
.toast { font-size: 13px; min-height: 1.6em; color: var(--muted); }
.toast.bad { color: var(--red); font-weight: 700; }
.toast.good { color: var(--green); font-weight: 700; }

/* Paper form */
.sheet { background: var(--paper); color: var(--paper-ink); border: 1px solid var(--line); border-radius: 4px; padding: 22px 20px 18px; box-shadow: 0 1px 0 var(--line), 0 10px 24px -18px rgba(0,0,0,.45); font-family: var(--font-form); }
.sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 6px 16px; border-bottom: 2px solid var(--paper-rule); padding-bottom: 10px; margin-bottom: 14px; }
.sheet-head h2 { font-size: 24px; font-weight: 900; letter-spacing: .08em; }
.sheet-head .meta { font-family: var(--font-ui); font-size: 12px; color: var(--paper-label); text-align: right; }
.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--paper-rule); border-left: 1px solid var(--paper-rule); }
.sec { grid-column: span 6; background: #e9edf1; color: var(--paper-ink); font-family: var(--font-ui); font-weight: 700; font-size: 13px; padding: 4px 10px; border-right: 1px solid var(--paper-rule); border-bottom: 1px solid var(--paper-rule); letter-spacing: .06em; }
.f { position: relative; border-right: 1px solid var(--paper-rule); border-bottom: 1px solid var(--paper-rule); padding: 6px 10px 8px; min-height: 58px; display: grid; align-content: start; gap: 2px; min-width: 0; }
.f.s2 { grid-column: span 2; } .f.s3 { grid-column: span 3; } .f.s4 { grid-column: span 4; } .f.s6 { grid-column: span 6; }
.f label { font-family: var(--font-ui); font-size: 11.5px; color: var(--paper-label); letter-spacing: .04em; }
.f .v { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.f .v.blank { color: transparent; border-bottom: 1px dotted var(--paper-label); min-height: 1.5em; }
.f .v .hand { font-family: "Kaiti TC", "BiauKai", "DFKai-SB", var(--font-form); color: #24489a; font-weight: 600; }
.f.click { cursor: pointer; transition: background .15s; }
.f.click:hover { background: rgba(31, 78, 121, .06); }
.f.lock { background: #eeeee8; cursor: default; }
.f.office { background: repeating-linear-gradient(-45deg, #f0f0ea 0 6px, #f7f7f2 6px 12px); }
.f.office .v { color: var(--paper-label); font-size: 13px; font-family: var(--font-ui); font-weight: 400; }
.box { display: inline-block; max-width: 100%; margin-right: 12px; }
.box::before { content: "☐"; font-size: 17px; }
.box.on::before { content: "☑"; color: #24489a; }
.found-y { box-shadow: inset 0 0 0 3px var(--yellow); background: rgba(201, 138, 0, .08) !important; }
.found-r { box-shadow: inset 0 0 0 3px var(--red); background: rgba(196, 48, 43, .07) !important; }
.missed { box-shadow: inset 0 0 0 3px transparent; outline: 2px dashed var(--paper-label); outline-offset: -5px; }
.badge { position: absolute; top: -9px; right: -9px; width: 24px; height: 24px; border-radius: 50%; color: #fff; font: 700 13px/24px var(--font-ui); text-align: center; z-index: 2; }
.badge.y { background: #c98a00; } .badge.r { background: #c4302b; } .badge.m { background: #7a8794; }
.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-4px); } 40%,80% { transform: translateX(4px); } }
.pop { animation: pop .3s ease-out; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.sys { font-family: var(--font-ui); background: #eef3f8; border: 1px solid #b9c9d9; border-radius: 6px; padding: 8px 12px; margin-bottom: 16px; display: grid; gap: 4px; }
.sys-t { font-size: 11.5px; font-weight: 700; color: #1f4e79; letter-spacing: .04em; }
.sys-g { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 14px; font-weight: 500; }
.sys-g small { color: var(--paper-label); margin-right: 6px; font-size: 12px; }
.sheet-foot { font-family: var(--font-ui); font-size: 11.5px; color: var(--paper-label); margin-top: 10px; }

/* Decision + result */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px 20px; display: grid; gap: 14px; }
.panel h2 { font-size: 22px; }
.score-big { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.score-big .n { font-family: var(--font-form); font-size: 56px; font-weight: 900; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.score-big .t { font-size: 22px; font-weight: 900; }
.breakdown { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; font-size: 14px; max-width: 360px; font-variant-numeric: tabular-nums; }
.breakdown span:nth-child(even) { text-align: right; font-weight: 700; }
.cards { display: grid; gap: 10px; }
.card { border: 1px solid var(--line); border-left-width: 4px; border-radius: 6px; padding: 12px 14px; display: grid; gap: 6px; }
.card.y { border-left-color: var(--yellow); } .card.r { border-left-color: var(--red); }
.card h3 { font-size: 16px; }
.card dl { margin: 0; display: grid; grid-template-columns: 5.5em 1fr; gap: 4px 10px; font-size: 14px; }
.card dt { color: var(--muted); }
.card dd { margin: 0; min-width: 0; }
.pitch { border-radius: 8px; padding: 14px 16px; background: var(--desk); font-size: 14px; }
.pitch b { color: var(--accent); }
.ans-level { display: grid; gap: 12px; padding-top: 18px; border-top: 1px solid var(--line); }
.ans-level h2 { font-size: 19px; }
.ans-level h3 { font-size: 16px; margin: 0; }
.note { font-size: 12px; color: var(--muted); text-align: center; }

.levels { display: flex; flex-wrap: wrap; gap: 8px; }
.lv { border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 999px; padding: 6px 16px; font-weight: 700; font-size: 14px; }
.lv:hover { border-color: var(--accent); }
.lv.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.lv:disabled { opacity: .5; cursor: not-allowed; }
.f .v.stamp-empty { color: var(--paper-label); font-size: 13px; font-weight: 400; font-family: var(--font-ui); }
@media (max-width: 560px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sec, .f.s2, .f.s3, .f.s4, .f.s6 { grid-column: span 2; }
  .f.half { grid-column: span 1; }
  .sheet { padding: 16px 12px 14px; }
  .sheet-head .meta { text-align: left; }
}
@media (prefers-reduced-motion: reduce) { .shake, .pop { animation: none; } .bar i { transition: none; } }
</style>

<div class="wrap">
  <section class="intro" id="intro">
    <span class="eyebrow" id="introEyebrow">櫃台受理挑戰</span>
    <h1>申請書找碴王</h1>
    <div class="levels" id="levels" role="group" aria-label="選擇關卡"></div>
    <p id="introText"></p>
    <div class="rules">
      <div class="rule"><span class="chip y">一般疏失 +10</span><b>漏填、填錯、前後矛盾</b><span>需要補正，現場無法處理的才退件。</span></div>
      <div class="rule"><span class="chip r">詐騙警訊 +20</span><b>看起來合規，但不對勁</b><span>要啟動關懷提問或照會本人。</span></div>
      <div class="rule"><span class="chip n">點錯 −3 秒、−5 分</span><b>沒問題的欄位不要亂點</b><span>全部找到且點錯不超過 2 次，才有精準加分和剩餘秒數加分。</span></div>
    </div>
    <div class="row"><button class="btn" id="startBtn" type="button">開始找碴</button><button class="btn ghost" id="answersBtn" type="button">直接看解答</button><span class="toast" id="bestLine"></span></div>
  </section>

  <div class="hud" id="hud" hidden>
    <div class="hud-top">
      <span class="stat"><small>剩餘</small><span id="timeTxt">60.0</span> 秒</span>
      <span class="stat"><small>已找到</small><span id="foundTxt">0</span> / <span id="totalTxt">6</span></span>
      <span class="stat"><small>分數</small><span id="scoreTxt">0</span></span>
      <button class="btn ghost" id="doneBtn" type="button" style="padding:4px 12px;font-size:13px">找碴完成</button>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="toast" id="toast">點擊你認為有問題的欄位。</div>
  </div>

  <article class="sheet" id="sheet" hidden>
    <div class="sys" id="sys"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <div class="meta">訓練用仿製表單</div>
    </div>
    <div class="grid" id="formGrid"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </article>

  <section class="panel" id="result" hidden>
    <span class="eyebrow" id="resultEyebrow">結果</span>
    <div class="score-big"><span class="n" id="finalScore">0</span><span class="t" id="rankTxt"></span></div>
    <div class="breakdown" id="breakdown"></div>
    <h2 style="font-size:18px;margin-top:6px">逐項揭曉</h2>
    <div class="cards" id="cards"></div>
    <div class="pitch" id="pitch"></div>
    <div class="row">
      <button class="btn" id="againBtn" type="button">再玩一次</button>
      <button class="btn ghost" id="nextBtn" type="button"></button>
    </div>
  </section>

  <section class="panel" id="answers" hidden>
    <span class="eyebrow">審閱用</span>
    <h2>全部關卡解答</h2>
    <p style="margin:0;color:var(--muted)">彩色框是題目，數字對應下方的解說。請協助確認「臨櫃怎麼做」是否符合實務。</p>
    <div id="answersBody"></div>
    <div class="row"><button class="btn" id="answersBack" type="button">回到首頁</button></div>
  </section>

  <p class="note">申請書找碴王 · 實習成果展試玩版</p>
</div>

  cur = i;

  FIELDS = L.fields; ERRORS = L.errors;
  $("introEyebrow").textContent = `櫃台受理挑戰 · ${L.name}`;

  $("resultEyebrow").textContent = `${L.name}結果`;
  const nb = $("nextBtn");
  if (i < LEVELS.length - 1) { nb.disabled = false; nb.textContent = `下一關：${LEVELS[i + 1].tab.split(" · ")[1]}`; }
  else { nb.disabled = true; nb.textContent = "已完成全部關卡"; }

const TIME = 60, PENALTY = 3;
const $ = (id) => document.getElementById(id);
let state;

function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function save(key, v) { try { localStorage.setItem(key, v); } catch (e) {} }

function showBest() {
  const b = load(`zhaocha-l${cur + 1}-best`);
  $("bestLine").textContent = b ? `這台裝置的最高分：${b} 分` : "";
}

function render() {
  const g = $("formGrid");
  g.innerHTML = "";
  FIELDS.forEach((f) => {
    if (f.sec) { const s = document.createElement("div"); s.className = "sec"; s.textContent = f.sec; g.appendChild(s); return; }
    const el = document.createElement("div");
    el.className = `f ${f.span}${f.half ? " half" : ""}${f.office ? " office" : f.id === "policy" ? " lock" : " click"}`;
    el.dataset.id = f.id;
    let v = f.v;
    el.innerHTML = `<label>${f.label}</label><div class="v${f.v ? "" : " blank"}">${v || "—"}</div>`;
    if (!f.office && f.id !== "policy") {
      el.tabIndex = 0;
      el.setAttribute("role", "button");
      el.setAttribute("aria-label", `${f.label}：${f.v ? f.v.replace(/<[^>]+>/g, " ") : "空白"}`);
      el.addEventListener("click", () => pick(f.id, el));
      el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(f.id, el); } });
    }
    g.appendChild(el);
  });
}

function fieldEl(id) { return document.querySelector(`.f[data-id="${id}"]`); }

function toast(msg, cls) { const t = $("toast"); t.textContent = msg; t.className = "toast " + (cls || ""); }

function start() {
  state = { left: TIME * 1000, found: new Set(), score: 0, wrong: 0, running: true };
  render();
  $("intro").hidden = true; $("result").hidden = true;
  $("hud").hidden = false; $("sheet").hidden = false;
  $("totalTxt").textContent = ERRORS.length;
  updateHud();
  toast("點擊你認為有問題的欄位。");
  let last = performance.now();
  clearInterval(state.timer);
  state.timer = setInterval(() => {
    const now = performance.now();
    state.left -= now - last; last = now;
    if (state.left <= 0) { state.left = 0; finish("時間到！"); }
    updateHud();
  }, 100);
  $("sheet").scrollIntoView({ behavior: "smooth", block: "start" });
}

function updateHud() {
  $("timeTxt").textContent = (state.left / 1000).toFixed(1);
  $("foundTxt").textContent = state.found.size;
  $("scoreTxt").textContent = state.score;
  const pct = Math.max(0, state.left / (TIME * 1000) * 100);
  $("barFill").style.width = pct + "%";
  $("barFill").classList.toggle("low", pct < 25);
}

function pick(id, el) {
  if (!state || !state.running) return;
  const idx = ERRORS.findIndex((e) => e.fields.includes(id));
  if (idx === -1) {
    state.left = Math.max(0, state.left - PENALTY * 1000);
    state.wrong++;
    state.score = Math.max(0, state.score - 5);
    el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
    toast(`這一欄沒有問題，扣 ${PENALTY} 秒、5 分。`, "bad");
    updateHud();
    return;
  }
  if (state.found.has(idx)) { toast("這個問題已經找到了。"); return; }
  const err = ERRORS[idx];
  state.found.add(idx);
  state.score += err.kind === "r" ? 20 : 10;
  markError(idx, err.kind);
  toast(`${err.kind === "r" ? "詐騙警訊" : "一般疏失"}：${err.title}`, "good");
  updateHud();
  if (state.found.size === ERRORS.length) finish("全部找到了！");
}

function markError(idx, cls) {
  ERRORS[idx].fields.forEach((fid, i) => {
    const el = fieldEl(fid);
    el.classList.add(cls === "m" ? "missed" : "found-" + cls);
    if (i === 0) {
      const b = document.createElement("span");
      b.className = "badge pop " + cls;
      b.textContent = idx + 1;
      el.appendChild(b);
    }
  });
}

function finish(msg) {
  if (!state.running) return;
  state.running = false;
  clearInterval(state.timer);
  state.timeLeft = Math.ceil(state.left / 1000);
  ERRORS.forEach((e, i) => { if (!state.found.has(i)) markError(i, "m"); });
  toast(`${msg} 虛線框是沒找到的問題，結果頁會逐項說明。`);
  $("doneBtn").disabled = true;
  showResult();
}

function showResult() {
  const y = [...state.found].filter((i) => ERRORS[i].kind === "y").length;
  const r = [...state.found].filter((i) => ERRORS[i].kind === "r").length;
  const all = state.found.size === ERRORS.length;
  const precise = all && state.wrong <= 2;
  const timeBonus = precise ? state.timeLeft : 0;
  const findPts = Math.max(0, y * 10 + r * 20 - state.wrong * 5);
  const total = findPts + (precise ? 30 : 0) + timeBonus;
  const rank = total >= 110 ? "找碴王" : total >= 70 ? "找碴高手" : total >= 40 ? "見習找碴員" : "找碴新手";
  $("finalScore").textContent = total;
  $("rankTxt").textContent = rank;
  const rows = [
    ["一般疏失", `${y} / ${ERRORS.filter((e) => e.kind === "y").length} × 10`, y * 10],
    ["詐騙警訊", `${r} / ${ERRORS.filter((e) => e.kind === "r").length} × 20`, r * 20],
    ["點錯扣分", `${state.wrong} 次 × 5（最低扣到 0）`, findPts - (y * 10 + r * 20)],
    ["精準加分", precise ? "達成" : "全部找到且點錯 ≤ 2 次", precise ? 30 : 0],
    ["剩餘秒數", precise ? `${state.timeLeft} 秒` : "精準加分達成才計算", timeBonus]
  ];
  $("breakdown").innerHTML = rows.map(([a, b, c]) => `<span>${a}　<span style="color:var(--muted);font-weight:400">${b}</span></span><span>${c < 0 ? "−" + (-c) : "+" + c}</span>`).join("");
  $("cards").innerHTML = ERRORS.map((e, i) => cardHtml(e, i, state.found.has(i))).join("");
  $("pitch").innerHTML = pitchHtml(ERRORS);
  const best = Number(load(`zhaocha-l${cur + 1}-best`) || 0);
  if (total > best) save(`zhaocha-l${cur + 1}-best`, String(total));
  played.add(cur);
  nextTarget = LEVELS.map((_, k) => (cur + 1 + k) % LEVELS.length).find((k) => !played.has(k));
  if (nextTarget === undefined) nextTarget = null;
  const nb = $("nextBtn");
  if (nextTarget !== null) { nb.disabled = false; nb.textContent = `下一關：${LEVELS[nextTarget].tab}`; }
  else { nb.disabled = true; nb.textContent = "已完成全部關卡"; }
  $("hud").hidden = true;
  $("result").hidden = false;
  $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

function cardHtml(e, i, got) {
  const status = got === null ? "" : `<span class="chip ${got ? "g" : "n"}">${got ? "你找到了" : "沒找到"}</span>`;
  return `<div class="card ${e.kind}">
      <div class="row"><span class="chip ${e.kind}">${i + 1} · ${e.kind === "r" ? "詐騙警訊" : "一般疏失"}</span>${status}</div>
      <h3>${e.title}</h3>
      <dl><dt>錯在哪</dt><dd>${e.where}</dd><dt>會造成</dt><dd>${e.impact}</dd><dt>臨櫃怎麼做</dt><dd>${e.counter}</dd><dt>優化建議</dt><dd>${e.prevent}</dd></dl>
    </div>`;
}

function pitchHtml(errs) {
  const y = errs.filter((e) => e.kind === "y").length;
  return `<b>作業優化提案：</b>這份申請書的 ${errs.length} 個問題中，${y} 個一般疏失可以靠「受理檢核清單」在收件當下就發現，請保戶當場補正，減少退件和來回奔波；另外 ${errs.length - y} 個詐騙警訊，可以由系統在登打時自動提示，提醒同仁啟動關懷提問。`;
}

function gridHtml(fields, errs) {
  return fields.map((f) => {
    if (f.sec) return `<div class="sec">${f.sec}</div>`;
    const idx = errs.findIndex((e) => e.fields.includes(f.id));
    const mark = idx === -1 ? "" : ` found-${errs[idx].kind}`;
    const badge = idx !== -1 && errs[idx].fields[0] === f.id ? `<span class="badge ${errs[idx].kind}">${idx + 1}</span>` : "";
    return `<div class="f ${f.span}${f.half ? " half" : ""}${f.office ? " office" : ""}${mark}"><label>${f.label}</label><div class="v${f.v ? "" : " blank"}">${f.v || "—"}</div>${badge}</div>`;
  }).join("");
}

function showAnswers() {
  $("answersBody").innerHTML = LEVELS.map((L) => `
    <div class="ans-level">
      <h2>${L.tab}：${L.title}</h2>
      <div class="sys"><span class="sys-t">櫃台系統 · ${L.sys[0]} 查詢結果</span><div class="sys-g">${L.sys[1].map(([k, v]) => `<span><small>${k}</small>${v}</span>`).join("")}</div></div>
      <div class="sheet"><div class="grid">${gridHtml(L.fields, L.errors)}</div></div>
      <div class="cards">${L.errors.map((e, i) => cardHtml(e, i, null)).join("")}</div>
      <div class="pitch">${pitchHtml(L.errors)}</div>
    </div>`).join("");
  $("intro").hidden = true;
  $("answers").hidden = false;
  window.scrollTo({ top: 0 });
}

function reset() {
  $("result").hidden = true; $("sheet").hidden = true;
  $("doneBtn").disabled = false;
  $("intro").hidden = false;
  setLevel(cur);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

$("startBtn").addEventListener("click", start);
$("answersBtn").addEventListener("click", showAnswers);
$("answersBack").addEventListener("click", () => { $("answers").hidden = true; $("intro").hidden = false; window.scrollTo({ top: 0 }); });
$("doneBtn").addEventListener("click", () => finish("找碴完成！"));
$("againBtn").addEventListener("click", reset);
$("nextBtn").addEventListener("click", () => { if (nextTarget !== null) { setLevel(nextTarget); reset(); } });
setLevel(0);
</script>
